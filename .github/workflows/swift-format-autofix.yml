# One-off: let swift-format fix every lint violation it reported, then push
# the result. Delete this file once the formatting is clean again.
name: swift-format autofix
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fmt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fmt:
    runs-on: macos-26
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          ref: cn

      - name: Format the Swift sources in place
        run: |
          xcrun swift-format format --in-place --configuration macos/.swift-format \
            --recursive macos/Jetlink macos/JetlinkTests JetlinkKit/Sources JetlinkKit/Tests ios/Jetlink
          git diff --stat

      - name: Commit and push the formatting
        run: |
          if git diff --quiet; then
            echo "nothing to format"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: swift-format autofix"
            git push
          fi
