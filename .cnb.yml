# 云原生构建配置，对应原 GitHub Actions ci.yml 的 Android APK 部分
# （ci.yml 的 Swift/macOS/ app 等任务依赖 macos runner，继续留在 GitHub 跑）。
#
# 两个阶段（工作区跨镜像共享，swift-out 由第一阶段产出、第二阶段消费）：
#   1. swift:6.4-noble 容器：NDK + Swift Android SDK，构建 libjetlink.so
#   2. eclipse-temurin:21 容器：Android SDK + gradle，:app:testDebugUnitTest
#      + :app:assembleRelease 打出 release APK
# APK 上传为触发 commit 的附件（构建详情页可下载）。
#
# 签名：CNB 环境若配置了 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_ALIAS（发布密钥的 base64），APK 用 release key 签；否则自动回退
# debug key（与 GitHub CI 的 HAVE_SIGNING 逻辑一致，直接装、能覆盖 debug 包）。

.build-android: &build-android
  name: android apk
  runner:
    cpus: 8
  env:
    ANDROID_HOME: /opt/android-sdk
    ANDROID_NDK_HOME: /opt/android-ndk/30.0.16248370
    NDK_RELEASE: r30
    SWIFT_SDK_BUNDLE: /root/.swiftpm/swift-sdks/swift-6.4.0-RELEASE_android.artifactbundle
    ONNXRUNTIME: "1.29.0"
  docker:
    image: swift:6.4-noble
    volumes:
      # NDK / Swift Android SDK / Android SDK / gradle 缓存（仅在当前构建节点生效，
      # 首跑全量下载，之后命中缓存）
      - /opt/android-ndk:cow
      - /root/.swiftpm:cow
      - /opt/android-sdk:cow
      - /root/.gradle:cow
  stages:
    # ---------- 阶段 1：Swift server for Android（swift 容器） ----------
    - name: build libjetlink.so
      script: |
        set -e
        sed -i 's|http://archive.ubuntu.com|https://mirrors.cloud.tencent.com|g; s|http://security.ubuntu.com|https://mirrors.cloud.tencent.com|g' /etc/apt/sources.list.d/ubuntu.sources
        apt-get update >/dev/null
        apt-get install -y --no-install-recommends ca-certificates curl unzip >/dev/null

        # NDK（缓存命中即跳过下载）
        if [ ! -d "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" ]; then
          curl -fsSL -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_RELEASE}-linux.zip" \
            || curl -fL --retry 3 -o /tmp/ndk.zip "https://dl.google.cn/android/repository/android-ndk-${NDK_RELEASE}-linux.zip"
          unzip -q /tmp/ndk.zip -d /tmp/ndk
          mkdir -p /opt/android-ndk
          mv "/tmp/ndk/android-ndk-${NDK_RELEASE}" "$ANDROID_NDK_HOME"
        else
          echo "NDK cached at $ANDROID_NDK_HOME"
        fi

        # Swift SDK for Android（与工具链版本严格一致）
        if [ ! -d "$SWIFT_SDK_BUNDLE" ]; then
          swift sdk install \
            https://download.swift.org/swift-6.4.0-release/android-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_android.artifactbundle.tar.gz \
            --checksum 21fb555122a3d801ad943d48df7ebffdd8824de61c25c180bb792d3edaee0b43
        else
          echo "Swift Android SDK cached"
        fi

        # onnxruntime-android-qnn AAR（构建只需要其中的 C 头文件）
        curl -fsSL -o /tmp/onnxruntime.aar \
          "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/com/microsoft/onnxruntime/onnxruntime-android-qnn/${ONNXRUNTIME}/onnxruntime-android-qnn-${ONNXRUNTIME}.aar" \
          || curl -fsSL --retry 3 -o /tmp/onnxruntime.aar \
          "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android-qnn/${ONNXRUNTIME}/onnxruntime-android-qnn-${ONNXRUNTIME}.aar"

        ANDROID_NDK_HOME="$ANDROID_NDK_HOME" bash android/scripts/swift-build.sh "$PWD/swift-out" /tmp/onnxruntime.aar release
        ls -la swift-out/arm64-v8a/

    # ---------- 阶段 2：Android APK（temurin 容器） ----------
    - name: build APK (gradle)
      image: eclipse-temurin:21
      script: |
        set -e
        sed -i 's|http://archive.ubuntu.com|https://mirrors.cloud.tencent.com|g; s|http://security.ubuntu.com|https://mirrors.cloud.tencent.com|g' /etc/apt/sources.list.d/ubuntu.sources
        apt-get update >/dev/null
        apt-get install -y --no-install-recommends ca-certificates curl unzip git >/dev/null

        # Android SDK 命令行工具（缓存命中即跳过）；AGP 会在 gradle 里自动下载
        # platform/build-tools，这里只接受许可即可——旧版 cmdline-tools 的仓库
        # 清单可能没有 platforms;android-37，显式安装反而会 404
        if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
          curl -fsSL -o /tmp/clt.zip "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" \
            || curl -fsSL --retry 3 -o /tmp/clt.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            || curl -fL --retry 3 -o /tmp/clt.zip "https://dl.google.cn/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/clt.zip -d /tmp/clt
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          mv /tmp/clt/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
        else
          echo "Android cmdline-tools cached"
        fi
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

        # 发布签名（未配置时 gradle 自动用 debug key）
        if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          export JETLINK_ANDROID_KEYSTORE=/tmp/release.keystore
          export JETLINK_ANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          export JETLINK_ANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS"
          echo "signing with the release key"
        else
          echo "no release key configured, falling back to the debug key"
        fi

        # gradle 分发包走腾讯镜像
        sed -i 's|https://services.gradle.org|https://mirrors.cloud.tencent.com/gradle|' android/gradle/wrapper/gradle-wrapper.properties
        # Maven Central 对 CNB 出口 IP 限流（429），init 脚本把仓库镜像前置。
        # 注意：.cnb.yml 的块标量里不能放顶格 heredoc，用 echo 逐行生成。
        M="$HOME/.gradle/init.d/01-mirrors.gradle"
        mkdir -p "$HOME/.gradle/init.d"
        {
          echo "beforeSettings { settings ->"
          echo "  settings.pluginManagement {"
          echo "    repositories {"
          echo "      maven { url = uri('https://mirrors.cloud.tencent.com/nexus/repository/maven-public/') }"
          echo "      maven { url = uri('https://maven.aliyun.com/repository/gradle-plugin') }"
          echo "    }"
          echo "  }"
          echo "  try {"
          echo "    settings.dependencyResolutionManagement.repositories {"
          echo "      maven { url = uri('https://mirrors.cloud.tencent.com/nexus/repository/maven-public/') }"
          echo "      maven { url = uri('https://maven.aliyun.com/repository/public') }"
          echo "    }"
          echo "  } catch (Exception ignored) {}"
          echo "}"
          echo "projectsLoaded {"
          echo "  rootProject.buildscript {"
          echo "    repositories {"
          echo "      maven { url = uri('https://mirrors.cloud.tencent.com/nexus/repository/maven-public/') }"
          echo "      maven { url = uri('https://maven.aliyun.com/repository/public') }"
          echo "    }"
          echo "  }"
          echo "}"
        } > "$M"
        echo "--- gradle init script ---"; cat "$M"
        cd android
        ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease -Pjetlink.prebuiltSwift="$PWD/../swift-out"
        ls -la app/build/outputs/apk/release/

    - name: upload APK
      image: cnbcool/attachments:latest
      settings:
        attachments: android/app/build/outputs/apk/release/app-release.apk

"**":
  # 所有分支 push 均打包（与 GitHub ci.yml 的行为一致；cn 分支用于发版）
  push:
    - *build-android
  web_trigger_build_apk:
    - *build-android
  # API 触发（cnb build start-build --event api_trigger_build_apk）
  api_trigger_build_apk:
    - *build-android
